name: Tests

on:
  push:
  pull_request:

# Builds images for target boards.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ matrix.go }}
      - name: Vet Go
        # go test runs a reduced vet set that leaves out copylocks, which is
        # what reports a copied Value.
        run: go vet ./...
      - name: Test Go
        run: go test -v ./...
